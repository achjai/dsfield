<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#f2eee4;
    --paper-2:#e9e4d7;
    --card:#faf7f0;
    --ink:#111110;
    --ink-soft:#33322e;
    --muted:#7a7566;
    --line:#cfc9b8;
    --line-soft:#ddd7c6;
    --accent:#e0491c;
    --accent-soft:rgba(224,73,28,.10);
    --serif:'Instrument Serif', Georgia, serif;
    --sans:'Inter', system-ui, -apple-system, sans-serif;
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    --r:4px;
  }

  *,*::before,*::after{box-sizing:border-box;}

  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--ink);color:var(--paper);}

  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-track{background:var(--paper-2);}
  ::-webkit-scrollbar-thumb{background:#b8b2a1;border:3px solid var(--paper-2);border-radius:99px;}
  ::-webkit-scrollbar-thumb:hover{background:#8f8a7b;}

  /* subtle paper texture via fine dot grid */
  .paper-tex{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(17,17,16,.05) 1px, transparent 1px);
    background-size:22px 22px;
    -webkit-mask-image:radial-gradient(ellipse 90% 60% at 50% 0%, #000 20%, transparent 85%);
    mask-image:radial-gradient(ellipse 90% 60% at 50% 0%, #000 20%, transparent 85%);
  }

  main,header,footer{position:relative;z-index:1;}

  .wrap{
    width:min(1140px, calc(100% - 48px));
    margin-inline:auto;
  }

  .mono{
    font-family:var(--mono);
    font-size:.72rem;
    letter-spacing:.02em;
    text-transform:lowercase;
  }

  .eyebrow{
    display:inline-flex;align-items:center;gap:10px;
    font-family:var(--mono);font-size:.7rem;
    color:var(--muted);
    letter-spacing:.04em;
    text-transform:lowercase;
  }
  .eyebrow::before{
    content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);
    flex:none;
  }

  /* ---------- header ---------- */
  .site-header{
    position:sticky;top:0;z-index:40;
    background:rgba(242,238,228,.82);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    display:flex;align-items:center;justify-content:space-between;
    height:64px;gap:24px;
  }
  .brand{display:inline-flex;align-items:center;gap:11px;}
  .brand-mark{
    width:26px;height:26px;flex:none;
    display:grid;place-items:center;
    font-family:var(--mono);font-size:.72rem;font-weight:500;
    color:var(--paper);
    background:var(--ink);
    border-radius:var(--r);
  }
  .brand-name{
    font-family:var(--mono);font-size:.82rem;font-weight:500;letter-spacing:-.01em;
  }

  .nav-links{display:flex;align-items:center;gap:26px;}
  .nav-links a:not(.btn){
    font-family:var(--mono);font-size:.76rem;
    color:var(--muted);
    transition:color .18s ease;
  }
  .nav-links a:not(.btn):hover{color:var(--ink);}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:.76rem;
    padding:9px 15px;
    border-radius:var(--r);
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    transition:background .18s ease, color .18s ease, transform .18s ease, border-color .18s ease;
  }
  .btn:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-ghost{
    background:transparent;color:var(--ink);border-color:var(--line);
  }
  .btn-ghost:hover{background:var(--ink);border-color:var(--ink);color:var(--paper);}
  .btn .arw{transition:transform .2s ease;}
  .btn:hover .arw{transform:translateX(2px);}

  /* ---------- hero ---------- */
  .hero{
    display:grid;grid-template-columns:1.05fr .95fr;
    gap:68px;align-items:center;
    padding:88px 0 72px;
  }

  h1{
    margin:22px 0 0;
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(2.9rem, 6.4vw, 5.1rem);
    line-height:.98;
    letter-spacing:-.022em;
  }
  h1 em{
    font-style:italic;
    color:var(--accent);
  }

  .lede{
    margin:26px 0 0;
    max-width:48ch;
    font-size:1.05rem;
    line-height:1.65;
    color:var(--ink-soft);
  }

  .cta-row{display:flex;gap:10px;margin-top:32px;flex-wrap:wrap;}

  .feature-list{
    list-style:none;margin:38px 0 0;padding:0;
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:0;
    border-top:1px solid var(--line-soft);
  }
  .feature-list li{
    display:flex;align-items:center;gap:9px;
    padding:12px 0;
    font-family:var(--mono);font-size:.75rem;
    color:var(--muted);
    border-bottom:1px solid var(--line-soft);
  }
  .feature-list li:nth-child(odd){padding-right:12px;}
  .feature-list li:nth-child(even){padding-left:12px;border-left:1px solid var(--line-soft);}
  .feature-list li::before{
    content:"";width:5px;height:5px;flex:none;
    background:var(--accent);border-radius:1px;
    transform:rotate(45deg);
  }

  /* ---------- visual panel ---------- */
  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 22px 40px -32px rgba(17,17,16,.5);
  }
  .panel-bar{
    display:flex;align-items:center;gap:12px;
    padding:11px 14px;
    border-bottom:1px solid var(--line-soft);
    background:rgba(17,17,16,.015);
  }
  .panel-bar .dots{display:flex;gap:5px;flex:none;}
  .panel-bar .dots i{
    display:block;width:9px;height:9px;border-radius:50%;
    background:#cfc9b8;
  }
  .panel-bar .dots i:nth-child(1){background:var(--accent);}
  .panel-title{
    font-family:var(--mono);font-size:.7rem;
    color:var(--muted);
  }
  .panel-right{
    margin-left:auto;
    font-family:var(--mono);font-size:.68rem;
    color:var(--muted);
  }

  .viz{
    padding:26px 20px 18px;
    background-image:repeating-linear-gradient(to top, rgba(17,17,16,.045) 0 1px, transparent 1px 42px);
  }
  .viz-track{
    display:flex;align-items:flex-end;gap:8px;
    height:180px;
  }
  .viz-bar{
    flex:1;min-height:22px;
    display:flex;justify-content:center;align-items:flex-start;
    padding-top:5px;
    background:var(--ink);
    border-radius:2px 2px 0 0;
    transition:height .42s cubic-bezier(.4,0,.2,1), background .2s ease;
  }
  .viz-bar span{
    font-family:var(--mono);font-size:.55rem;font-weight:500;
    color:rgba(114, 124, 70, 0.568);
    transform:translateY(-19px);
    transition:color .2s ease;
  }
  .viz-bar.is-cmp{background:var(--accent);}
  .viz-bar.is-swap{background:var(--accent);}
  .viz-bar.is-done{background:#b8b2a1;}

  .viz-legend{
    display:flex;gap:18px;flex-wrap:wrap;
    padding:14px 20px 16px;
    border-top:1px solid var(--line-soft);
    font-family:var(--mono);font-size:.66rem;
    color:var(--muted);
  }
  .viz-legend span{display:inline-flex;align-items:center;gap:7px;}
  .sw{width:8px;height:8px;display:block;border-radius:1px;}
  .sw-c{background:var(--ink);}
  .sw-s{background:var(--accent);}
  .sw-d{background:#b8b2a1;}

  /* ---------- section ---------- */
  section{scroll-margin-top:88px;}

  .sect-head{
    display:grid;grid-template-columns:1fr 1fr;
    gap:40px;
    padding-bottom:36px;
    border-bottom:1px solid var(--line);
    margin-bottom:44px;
  }
  .sect-head h2{
    margin:0;
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(1.9rem, 3.4vw, 2.6rem);
    line-height:1.04;
    letter-spacing:-.02em;
  }
  .sect-head h2 em{font-style:italic;color:var(--accent);}
  .sect-head p{
    margin:0;
    align-self:end;
    color:var(--muted);
    font-size:.94rem;
    max-width:44ch;
  }

  /* ---------- cards ---------- */
  .cards{
    display:grid;grid-template-columns:repeat(3,1fr);
    border-top:1px solid var(--line);
  }
  .card{
    padding:30px 26px 32px;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    transition:background .22s ease;
  }
  .card:last-child{border-right:none;}
  .card:hover{background:var(--card);}

  .card .idx{
    font-family:var(--mono);font-size:.7rem;
    color:var(--muted);
    transition:color .22s ease;
  }
  .card:hover .idx{color:var(--accent);}
  .card .cat{
    display:block;margin-top:22px;
    font-family:var(--mono);font-size:.66rem;
    letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);
  }
  .card h3{
    margin:8px 0 8px;
    font-family:var(--serif);font-weight:400;
    font-size:1.55rem;letter-spacing:-.015em;
    line-height:1.1;
  }
  .card p{
    margin:0;
    color:var(--ink-soft);
    font-size:.9rem;
    line-height:1.6;
  }
  .card ul{
    list-style:none;margin:20px 0 0;padding:16px 0 0;
    border-top:1px dashed var(--line);
  }
  .card li{
    position:relative;
    padding:4px 0 4px 16px;
    font-family:var(--mono);font-size:.72rem;
    color:var(--muted);
  }
  .card li::before{
    content:"";position:absolute;left:0;top:11px;
    width:5px;height:1px;background:var(--muted);
    transition:background .22s ease;
  }
  .card:hover li::before{background:var(--accent);}

  /* ---------- trace section ---------- */
  .trace{
    display:grid;grid-template-columns:1fr 1fr;
    gap:68px;align-items:center;
    padding:96px 0 108px;
  }
  .trace h2{
    margin:14px 0 0;
    font-family:var(--serif);font-weight:400;
    font-size:clamp(1.9rem, 3.4vw, 2.7rem);
    line-height:1.05;
    letter-spacing:-.02em;
  }
  .trace p{
    margin:20px 0 0;
    color:var(--ink-soft);
    line-height:1.7;
    max-width:46ch;
  }

  .trace-body{padding:22px 20px;}
  .input-row{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;
    padding:11px 14px;
    border:1px solid var(--line);
    border-radius:var(--r);
    background:var(--paper-2);
    font-family:var(--mono);font-size:.72rem;
    color:var(--muted);
  }
  .input-row code{
    font-family:var(--mono);font-size:.78rem;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    padding:2px 7px;
    border-radius:3px;
  }
  code{
    font-family:var(--mono);
    font-size:.84em;
    color:var(--accent);
    background:var(--accent-soft);
    padding:1px 5px;
    border-radius:3px;
  }

  .steps{display:grid;gap:0;margin-top:18px;border-top:1px solid var(--line-soft);}
  .step{
    display:flex;gap:14px;align-items:flex-start;
    padding:14px 4px;
    border-bottom:1px solid var(--line-soft);
  }
  .step b{
    flex:none;
    width:22px;height:22px;
    display:grid;place-items:center;
    font-family:var(--mono);font-size:.66rem;font-weight:500;
    color:var(--paper);
    background:var(--ink);
    border-radius:3px;
  }
  .step p{
    margin:2px 0 0;
    font-size:.86rem;
    color:var(--ink-soft);
    line-height:1.55;
  }

  /* ---------- cta ---------- */
  .cta{
    position:relative;
    border:1px solid var(--ink);
    border-radius:6px;
    padding:64px 44px;
    text-align:center;
    background:var(--card);
    overflow:hidden;
  }
  .cta::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(17,17,16,.08) 1px, transparent 1px);
    background-size:16px 16px;
    -webkit-mask-image:radial-gradient(70% 90% at 50% 50%, #000, transparent);
    mask-image:radial-gradient(70% 90% at 50% 50%, #000, transparent);
  }
  .cta > *{position:relative;}
  .cta h3{
    margin:0;
    font-family:var(--serif);font-weight:400;
    font-size:clamp(1.9rem, 3.6vw, 2.8rem);
    line-height:1.05;
    letter-spacing:-.022em;
  }
  .cta h3 em{font-style:italic;color:var(--accent);}
  .cta p{
    margin:16px auto 30px;
    max-width:44ch;
    color:var(--muted);
    font-size:.96rem;
  }

  /* ---------- footer ---------- */
  footer{
    border-top:1px solid var(--line);
    margin-top:96px;
    padding:26px 0 38px;
  }
  .foot{
    display:flex;align-items:center;justify-content:space-between;
    gap:18px;flex-wrap:wrap;
    font-family:var(--mono);font-size:.72rem;
    color:var(--muted);
  }
  .foot .right{display:flex;gap:22px;}
  .foot a{transition:color .18s ease;}
  .foot a:hover{color:var(--ink);}

  /* ---------- reveal ---------- */
  .reveal{
    opacity:0;
    transform:translateY(14px);
    transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1);
  }
  .reveal.in{opacity:1;transform:none;}

  /* ---------- responsive ---------- */
  @media (max-width:940px){
    .hero{grid-template-columns:1fr;gap:48px;padding:60px 0 52px;}
    .trace{grid-template-columns:1fr;gap:40px;padding:72px 0 84px;}
    .cards{grid-template-columns:1fr;}
    .card{border-right:none;}
    .sect-head{grid-template-columns:1fr;gap:14px;}
    .sect-head p{max-width:none;}
  }
  @media (max-width:600px){
    .wrap{width:calc(100% - 32px);}
    .nav-links a:not(.btn){display:none;}
    .feature-list{grid-template-columns:1fr;}
    .feature-list li:nth-child(even){padding-left:0;border-left:none;}
    .feature-list li:nth-child(odd){padding-right:0;}
    .cta{padding:46px 22px;}
    .trace-body{padding:18px 14px;}
    .viz{padding:22px 14px 14px;}
    .viz-track{height:150px;}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
    html{scroll-behavior:auto;}
    .reveal{opacity:1;transform:none;}
  }
</style>
